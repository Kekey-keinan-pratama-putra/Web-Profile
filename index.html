<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro RPG Portfolio</title>
    <!-- Google Fonts: Tekstur Pixel Klasik -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #0c0f1d;
            --window-bg: #181c33;
            --border-color: #ffffff;
            --text-primary: #ffffff;
            --text-green: #39ff14;
            --text-yellow: #facc15;
            --hp-color: #ef4444;
            --mp-color: #3b82f6;
            --font-pixel: 'Press Start 2P', monospace;
            --font-retro: 'VT323', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-retro);
            font-size: 24px;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* --- 2. RETRO COMPONENT STYLES (Pixel Borders) --- */
        .pixel-box {
            background: var(--window-bg);
            border: 4px solid var(--border-color);
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 0 rgba(0,0,0,0.5);
        }

        /* Efek Tombol Arcade */
        .btn-arcade {
            font-family: var(--font-pixel);
            font-size: 14px;
            color: var(--text-primary);
            background: #2563eb;
            border: 4px solid #fff;
            padding: 12px 24px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #1d4ed8;
            transition: all 0.1s ease;
            display: inline-block;
        }
        .btn-arcade:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #1d4ed8;
        }
        .btn-arcade:hover {
            background: #3b82f6;
            color: var(--text-yellow);
        }

        /* --- 3. LAYOUT: START SCREEN --- */
        #start-screen {
            position: fixed;
            top:0; left:0; width:100vw; height:100vh;
            background: #000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        #start-screen h1 {
            font-family: var(--font-pixel);
            font-size: 2rem;
            color: var(--text-yellow);
            margin-bottom: 40px;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* --- 4. MAIN INTERFACE --- */
        .wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: none; /* Muncul setelah Start diklik */
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h2 {
            font-family: var(--font-pixel);
            font-size: 1.8rem;
            color: var(--text-green);
        }

        /* Grid Dashboard */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        /* --- SECTION: CHARACTER STATUS --- */
        .char-profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .avatar-frame {
            width: 90px;
            height: 90px;
            border: 4px solid var(--text-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e293b;
            font-size: 50px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .char-info h3 {
            font-family: var(--font-pixel);
            font-size: 18px;
            color: var(--text-yellow);
        }

        /* Status Bars */
        .status-row {
            margin-bottom: 15px;
        }
        .status-label {
            font-family: var(--font-pixel);
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .bar-outer {
            width: 100%;
            height: 20px;
            border: 3px solid #fff;
            background: #000;
        }
        .bar-inner {
            height: 100%;
            width: 100%;
            transition: width 0.4s ease;
        }
        .bar-hp { background: var(--hp-color); }
        .bar-mp { background: var(--mp-color); }

        /* Stats List */
        .stats-list {
            list-style: none;
            margin-top: 20px;
            font-size: 28px;
        }
        .stats-list li {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .stat-val { color: var(--text-green); }

        /* --- SECTION: QUEST LOG (PORTFOLIO) --- */
        .quest-section h3 {
            font-family: var(--font-pixel);
            font-size: 16px;
            color: var(--text-yellow);
            margin-bottom: 20px;
            border-bottom: 4px dashed #fff;
            padding-bottom: 8px;
        }
        .quest-item {
            border: 2px dashed #475569;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
        }
        .quest-title {
            font-family: var(--font-pixel);
            font-size: 14px;
            color: var(--text-green);
            margin-bottom: 5px;
        }
        .quest-status {
            font-size: 20px;
            color: #94a3b8;
        }

        /* --- SECTION: CONTACT / SAVE GAME --- */
        .contact-form {
            grid-column: 1 / -1;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-family: var(--font-pixel);
            font-size: 12px;
            margin-bottom: 8px;
            color: var(--text-yellow);
        }
        .form-input {
            width: 100%;
            background: #000;
            border: 4px solid var(--border-color);
            color: #fff;
            font-family: var(--font-retro);
            font-size: 24px;
            padding: 10px;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--text-green);
        }

        /* Flash Level Up Overlay */
        #level-flash {
            position: fixed;
            top:0; left:0; width:100vw; height:100vh;
            background: rgba(255,255,255,0.8);
            z-index: 1000;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- OVERLAY FLASH UNTUK LEVEL UP -->
    <div id="level-flash"></div>

    <!-- 1. START SCREEN LAYOUT -->
    <div id="start-screen">
        <h1>RETRO PROFILE v1.0</h1>
        <button class="btn-arcade" id="btn-start">PRESS START</button>
    </div>

    <!-- 2. MAIN INTERFACE CONTROLLER -->
    <div class="wrapper" id="main-content">
        <header>
            <h2>PLAYER PROFILE</h2>
        </header>

        <main class="grid-container">
            
            <!-- KOTAK KIRI: STATUS JENDELA RPG -->
            <section class="pixel-box">
                <div class="char-profile">
                    <!-- Icon Avatar (Bisa diganti image pixel/emoji) -->
                    <div class="avatar-frame">🧙‍♂️</div>
                    <div class="char-info">
                        <!-- Ganti dengan Nama Anda -->
                        <h3>Yudi Prasetyo</h3>
                        <p>Class: Web Developer</p>
                        <p>LV: <span id="char-level">20</span></p>
                    </div>
                </div>

                <!-- HP BAR -->
                <div class="status-row">
                    <div class="status-label"><span>HP (ENERGY)</span><span id="hp-text">100/100</span></div>
                    <div class="bar-outer"><div class="bar-inner bar-hp" id="hp-bar"></div></div>
                </div>

                <!-- MP BAR -->
                <div class="status-row">
                    <div class="status-label"><span>MP (FOCUS)</span><span id="mp-text">100/100</span></div>
                    <div class="bar-outer"><div class="bar-inner bar-mp" id="mp-bar"></div></div>
                </div>

                <!-- ATTRIBUTES -->
                <ul class="stats-list">
                    <li><span>STR (Gaming):</span> <span class="stat-val">99</span></li>
                    <li><span>DEX (Volleyball):</span> <span class="stat-val">85</span></li>
                    <li><span>INT (Coding):</span> <span class="stat-val">92</span></li>
                </ul>

                <div style="margin-top: 25px; text-align: center;">
                    <button class="btn-arcade" id="btn-levelup">LEVEL UP!</button>
                </div>
            </section>

            <!-- KOTAK KANAN: QUEST LOG (PORTFOLIO & HOBI) -->
            <section class="pixel-box quest-section">
                <h3>[ ACTIVE QUESTS ]</h3>
                <div class="quest-item">
